name: 功能建议
description: 提案：希望插件支持的新能力或行为调整
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        这个插件的定位是「把推推当作 dsh 的一个渠道前端」，按 dsh 的渠道插件契约实现。
        提建议时如果能说明「推推侧有什么原生能力可以更好利用」，会更容易被采纳。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      placeholder: 群里多人同时 @机器人 时，后一条会被合并，希望……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      placeholder: |
        可以复用推推的 xxx 能力……
        或者新增一个配置项 yyy……
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 推推通道（发送 / 流式 / 卡片 / 文件）
        - 中间件与访问控制
        - 会话与命令
        - 媒体与视觉
        - 端内绑定 / 设置面板
        - 文档 / 工程
    validations:
      required: true
