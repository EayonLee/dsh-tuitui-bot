# 本地开发用 patch overlay（绝对路径加载源码，无需构建、无需预装插件）
#
# 用法：
#   export TUITUI_BOT_APPID="你的AppID" TUITUI_BOT_SECRET="你的AppSecret"
#   npx @deepseek-ai/dsh web --patch /path/to/dsh-tuitui-bot/cordis.dev.yml
#
# 说明：name 换成你本机 checkout 的绝对路径；若 profile 已安装本插件，
# 先禁用 bundle 层那一行再插入源码版，避免同 id 冲突。

# 挂载 logger-console 插件，开启 debug 日志（insert 才能新增条目）
- insert:
    - id: logger-console
      name: '@deepseek-ai/cordis-plugin-logger-console'
      config:
        colors: 3             # 0 = 禁用颜色（只接受 false 或数字），3 表示支持 256 色
        levels:
          default: 3          # 3 = DEBUG，输出所有级别
        showTime: 'yyyy-MM-dd hh:mm:ss '

# 若 profile 已装插件，先禁用 bundle 层插入的那一行（未装则此行被跳过）
- id: im-tuitui
  disabled: true

# 源码版本用唯一 id，避免与 bundle 层同 id 冲突
- insert:
    - id: im-tuitui-dev
      name: '/path/to/dsh-tuitui-bot/src/index.ts'
      config:
        appId: __FROM_ENV__
        appSecret: __FROM_ENV__
        requireMention: true
        requireMentionInPost: true
        textChunkLimit: 4000
        streaming: true
        streamIntervalMs: 600
        sessionIdleTimeout: 1800000
        showToolResults: false
        interactive:
          enabled: true
        agentSteps:
          enabled: true
        debug: true
